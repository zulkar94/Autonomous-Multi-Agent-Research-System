[project]
name = "autonomous-research-system"
version = "1.0.0"
description = "Autonomous multi-agent research: search, verify, debate, cite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Md Zulkar Nine" }]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "SQLAlchemy==2.0.52",
    "aiosqlite==0.22.1",
    "asyncpg==0.31.0",
    "httpx==0.28.1",
    "PyJWT==2.13.0",
    "argon2-cffi==25.1.0",
    "python-json-logger==4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "bandit[toml]==1.9.4",
    "pip-audit==2.10.1",
    "types-python-jose",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# S105/S107 fire on the literal "access"/"bearer" token-kind strings, which are
# scheme identifiers rather than credentials.
"tests/*" = ["S105", "S106", "S311"]
"backend/app/security/tokens.py" = ["S105", "S107"]
"backend/app/schemas.py" = ["S105"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = false
no_implicit_optional = true
ignore_missing_imports = true
plugins = []

[tool.bandit]
exclude_dirs = ["tests", ".venv", "frontend"]
skips = ["B101"]

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
