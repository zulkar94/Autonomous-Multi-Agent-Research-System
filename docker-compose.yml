services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ars
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ars
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ars"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published: only the app container needs to reach the database.
    expose:
      - "5432"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set, e.g. `openssl rand -base64 48`}
      DATABASE_URL: postgresql+asyncpg://ars:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/ars
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-mock}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  pgdata:
